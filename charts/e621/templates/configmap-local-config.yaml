{{- $sitemapDir := "/app/public/data/sitemaps" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "e621.fullname" . }}-local-config
  labels:
    {{- include "e621.labels" . | nindent 4 }}
data:
  # config/application.rb requires this file unconditionally. The image bakes an
  # empty stub; mounting over it via subPath is how non-scalar and numeric
  # settings get in, since DANBOORU_* env vars always arrive as Strings.
  danbooru_local_config.rb: |
    # frozen_string_literal: true

    module Danbooru
      class CustomConfiguration < Configuration
{{ .Values.danbooru.localConfig | default "" | indent 8 }}
      end
    end

{{- if .Values.sitemap.enabled }}

  # SitemapGeneratorJob runs on a low_prio worker and writes into that pod's own
  # public/ directory, which the nginx sidecar in the web pods never sees. Point
  # it at the shared data volume instead; the nginx config aliases the matching
  # request paths back to it.
  zz_sitemap_path.rb: |
    # frozen_string_literal: true

    require "sitemap_generator"

    SitemapGenerator::Sitemap.public_path = {{ $sitemapDir | quote }}
{{- end }}
