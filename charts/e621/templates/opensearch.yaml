{{- if .Values.opensearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "e621.fullname" . }}-opensearch
  labels:
    {{- include "e621.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  ports:
    - name: http
      port: 9200
      targetPort: http
  selector:
    {{- include "e621.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "e621.fullname" . }}-opensearch
  labels:
    {{- include "e621.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  serviceName: {{ include "e621.fullname" . }}-opensearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "e621.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opensearch
  template:
    metadata:
      labels:
        {{- include "e621.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: opensearch
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- if .Values.opensearch.setMaxMapCount }}
      initContainers:
        # OpenSearch will not start unless vm.max_map_count is at least 262144.
        # This requires a privileged container; if your cluster forbids that,
        # leave opensearch.setMaxMapCount false and tune the nodes directly.
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
      {{- end }}
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image }}
          imagePullPolicy: {{ .Values.opensearch.pullPolicy }}
          env:
            - name: discovery.type
              value: single-node
            - name: logger.level
              value: WARN
            # The app connects over plain http with no credentials, matching
            # upstream's compose setup.
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.opensearch.javaOpts | quote }}
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.opensearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.opensearch.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.opensearch.persistence.size }}
{{- end }}
