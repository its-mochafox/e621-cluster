apiVersion: v1
kind: Service
metadata:
  name: {{ include "e621.fullname" . }}-web
  labels:
    {{- include "e621.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "e621.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "e621.fullname" . }}-web
  labels:
    {{- include "e621.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "e621.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        checksum/local-config: {{ include (print $.Template.BasePath "/configmap-local-config.yaml") . | sha256sum }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "e621.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "e621.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      # pitchfork's request timeout is 180s.
      terminationGracePeriodSeconds: 200
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        # Lift the precompiled assets out of the app image so the nginx sidecar
        # can serve them. Vite emits content-hashed filenames, which is why nginx
        # is a sidecar rather than its own Deployment: a separately-rolled nginx
        # would 404 every asset referenced by newly-rendered HTML.
        - name: copy-assets
          image: {{ include "e621.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "cp -a /app/public/. /assets/"]
          volumeMounts:
            - name: assets
              mountPath: /assets
        {{- include "e621.waitForDeps" . | nindent 8 }}

      containers:
        - name: e621
          image: {{ include "e621.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Matches the production image's default CMD.
          command: ["bundle", "exec", "pitchfork", "-c", "config/pitchfork.rb"]
          env:
            {{- include "e621.commonEnv" . | nindent 12 }}
            - name: PITCHFORK_LISTEN_ADDRESS
              value: "0.0.0.0:9000"
            # pitchfork recycles workers between 386MB and 768MB PSS. Keep the
            # memory limit above (768Mi * this) or the OOM killer wins first.
            - name: PITCHFORK_WORKER_COUNT
              value: {{ .Values.web.workerCount | quote }}
          ports:
            - name: app
              containerPort: 9000
          # Liveness deliberately uses /status, not /health. /health returns 503
          # while the pod is drained, which would otherwise restart-loop a pod
          # that was intentionally taken out of rotation.
          #
          # force_ssl is on, so without this header every probe is answered with
          # a 301 to https and the probe silently passes without reaching the app.
          startupProbe:
            httpGet:
              path: /status
              port: app
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /status
              port: app
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          lifecycle:
            # Drain before SIGTERM so the readiness probe fails and the endpoint
            # is withdrawn while in-flight requests finish.
            preStop:
              exec:
                command: ["/bin/sh", "-c", "touch /drain/out_of_rotation; sleep 15"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            {{- include "e621.appVolumeMounts" . | nindent 12 }}

        - name: nginx
          image: {{ .Values.web.nginx.image }}
          imagePullPolicy: {{ .Values.web.nginx.pullPolicy }}
          securityContext:
            # The nginx user in the official image. fsGroup is added as a
            # supplemental group, which is what makes the emptyDirs writable.
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
          # The image's own template mechanism substitutes every environment
          # variable it finds, which is risky next to nginx's own $variables.
          # Do the substitution explicitly against the three secrets that need it.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              envsubst '${DANBOORU_PROTECTED_FILE_SECRET} ${DANBOORU_REPLACEMENT_FILE_SECRET} ${DANBOORU_STAFF_FILE_SECRET}' \
                < /etc/nginx/templates/default.conf.template \
                > /etc/nginx/conf.d/default.conf
              exec nginx -g 'daemon off;'
          env:
            # Must be byte-identical to the values Rails signs with.
            {{- include "e621.fileSecretEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          # End-to-end readiness: nginx must be up and Rails must answer /health
          # with a 200. `bin/drain true` flips this to 503 and pulls the pod out
          # of the Service without restarting anything.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.web.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: assets
              mountPath: /app/public
              readOnly: true
            - name: data
              mountPath: /app/public/data
              readOnly: true
            - name: nginx-template
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: nginx-template
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            # nginx writes its pid here; the stock path is not writable by uid 101.
            - name: nginx-run
              mountPath: /tmp

      volumes:
        {{- include "e621.appVolumes" . | nindent 8 }}
        - name: assets
          emptyDir:
            sizeLimit: {{ .Values.web.assetsSizeLimit }}
        - name: nginx-template
          configMap:
            name: {{ include "e621.fullname" . }}-nginx
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "e621.fullname" . }}-web
  labels:
    {{- include "e621.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "e621.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
