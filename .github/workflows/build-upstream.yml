name: Build upstream master

# Upstream only publishes images on tag pushes, so tracking master means
# building it here. The build uses upstream's Dockerfile unmodified against a
# clean checkout of e621ng, which is what keeps this repo free of any upstream
# source and therefore free of merge conflicts.

on:
  schedule:
    # Every six hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to build (defaults to master)"
        required: false
        default: master
      force:
        description: "Rebuild even if the image tag already exists"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  UPSTREAM_REPO: e621ng/e621ng
  IMAGE: ghcr.io/${{ github.repository_owner }}/e621ng

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      tag: ${{ steps.resolve.outputs.tag }}
      image: ${{ steps.resolve.outputs.image }}
      needs_build: ${{ steps.exists.outputs.needs_build }}
    steps:
      - name: Resolve upstream commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'master' }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/${REF}" --jq .sha)
          SHORT=${SHA:0:12}
          # Lowercase, because GHCR rejects uppercase in repository names and
          # the owner login is mixed case.
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          {
            echo "sha=$SHA"
            echo "short=$SHORT"
            echo "tag=master-$SHORT"
            echo "image=$IMAGE_LC"
          } >> "$GITHUB_OUTPUT"
          echo "upstream ${REF} is at $SHA"

      - name: Check whether the image already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "forced rebuild"
            exit 0
          fi
          # The package is private, so an unauthenticated manifest inspect
          # always fails and would make every run a full rebuild.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect \
              "${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.tag }}" >/dev/null 2>&1; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "already built, nothing to do"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "not published yet, building"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream at the resolved commit
        uses: actions/checkout@v4
        with:
          repository: e621ng/e621ng
          ref: ${{ needs.resolve.outputs.sha }}
          # A shallow checkout is fine: the production image carries no .git and
          # reads its version from the DANBOORU_IMAGE_TAG build arg instead.
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          build-args: |
            GIT_TAG=${{ needs.resolve.outputs.tag }}
          # The runtime uid must match the ownership of the post-data volume.
          # Baked at build time because the image pre-chowns tmp/log/public/data.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}
            ${{ needs.resolve.outputs.image }}:master

  bump:
    needs: [resolve, build]
    # Also runs when the build was skipped because the image already existed.
    # Without this, a bump that failed once would never be retried until
    # upstream happened to move again. create-pull-request is a no-op when the
    # chart already points at the right tag.
    if: always() && needs.resolve.result == 'success' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the chart at the new image
        run: |
          set -euo pipefail
          TAG='${{ needs.resolve.outputs.tag }}'
          sed -i -E "s|^appVersion: .*|appVersion: \"${TAG}\"|" charts/e621/Chart.yaml
          grep -q "appVersion: \"${TAG}\"" charts/e621/Chart.yaml

      - name: Open or update the bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/bump-upstream
          base: main
          commit-message: "Bump upstream image to ${{ needs.resolve.outputs.tag }}"
          title: "Bump upstream image to ${{ needs.resolve.outputs.tag }}"
          body: |
            Built from [`${{ needs.resolve.outputs.sha }}`](https://github.com/e621ng/e621ng/commit/${{ needs.resolve.outputs.sha }}) on upstream master.

            Image: `${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}`

            Merging updates the chart's default image tag. Check the upstream diff
            for new migrations or config requirements before deploying; the
            pre-upgrade hook runs `db:migrate` automatically but new required
            environment variables are not detected for you.
          delete-branch: true
